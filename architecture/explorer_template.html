<title>Hermbot Architecture Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field-notebook workbench (view rail · graph stage · evidence panel) in Hermbot's own sage palette. */
:root{
  --bg:#f7f8f4; --surface:#ffffff; --side:#eef1e8; --line:#dfe4d7; --line-strong:#c7cfbb;
  --fg:#2b3329; --muted:#646d5f; --accent:#577045; --accent-soft:#e5ecdb; --accent-ink:#ffffff;
  --warn:#9a6b1f; --crit:#a24c34; --ok:#4f7a3a; --focus:#577045;
  --edge:#b7c0ab; --edge-hi:#577045; --node-text:#2b3329; --dim-alpha:.12;
  /* node families */
  --k-actor:#7b5ea7; --k-infra:#4d6f94; --k-secret:#b07d1e; --k-code:#577045; --k-fn:#8aa078;
  --k-runtime:#2f7f7a; --k-route:#4b5bab; --k-data:#9a6a3c; --k-ui:#a3527a; --k-know:#2f5d3a;
  --k-flow:#c08a1a; --k-state:#6d8f9c; --k-test:#5f7a8c; --k-doc:#7c7a5c; --k-dep:#8a8f86; --k-issue:#b5482f;
  --font-body:'DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171c16; --surface:#1f251d; --side:#222a20; --line:#323c2d; --line-strong:#46523f;
  --fg:#e3e9dd; --muted:#a3ae99; --accent:#9fbd84; --accent-soft:#2c3826; --accent-ink:#162013;
  --warn:#e0b25c; --crit:#e38a70; --ok:#9fcf84; --focus:#b6d39b;
  --edge:#4a5643; --edge-hi:#b6d39b; --node-text:#e3e9dd; --dim-alpha:.14;
  --k-actor:#b39ad8; --k-infra:#86a9cf; --k-secret:#e0b25c; --k-code:#9fbd84; --k-fn:#7f9a6c;
  --k-runtime:#6cc3bc; --k-route:#93a0e6; --k-data:#d39d6b; --k-ui:#de8db4; --k-know:#8fcf9d;
  --k-flow:#f0c45a; --k-state:#9ec1cf; --k-test:#9db6c8; --k-doc:#c2bf95; --k-dep:#a4aaa0; --k-issue:#f07f62;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171c16; --surface:#1f251d; --side:#222a20; --line:#323c2d; --line-strong:#46523f;
  --fg:#e3e9dd; --muted:#a3ae99; --accent:#9fbd84; --accent-soft:#2c3826; --accent-ink:#162013;
  --warn:#e0b25c; --crit:#e38a70; --ok:#9fcf84; --focus:#b6d39b;
  --edge:#4a5643; --edge-hi:#b6d39b; --node-text:#e3e9dd; --dim-alpha:.14;
  --k-actor:#b39ad8; --k-infra:#86a9cf; --k-secret:#e0b25c; --k-code:#9fbd84; --k-fn:#7f9a6c;
  --k-runtime:#6cc3bc; --k-route:#93a0e6; --k-data:#d39d6b; --k-ui:#de8db4; --k-know:#8fcf9d;
  --k-flow:#f0c45a; --k-state:#9ec1cf; --k-test:#9db6c8; --k-doc:#c2bf95; --k-dep:#a4aaa0; --k-issue:#f07f62;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:13px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:11.5px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
/* header */
.top{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;flex:none}
.brand b{font-size:17px;letter-spacing:-.4px;font-weight:700}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.search{position:relative;flex:1;min-width:0;max-width:520px}
.search input{width:100%;background:var(--side);border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 32px;font-size:13px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
#results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18);max-height:min(60vh,520px);overflow:auto;z-index:50}
#results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
#results button:hover,#results button.on{background:var(--accent-soft)}
#results .rl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#results .rp{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;background:var(--surface);white-space:nowrap}
.pill:hover{border-color:var(--line-strong)}
.pill.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));color:var(--ok)}
.pill.bad{border-color:var(--crit);color:var(--crit)}
.pill.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.iconbtn{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);border:1px solid transparent}
.iconbtn:hover{background:var(--side);color:var(--fg)}
.iconbtn.on{background:var(--accent-soft);color:var(--fg);border-color:var(--line)}
/* main grid */
.main{display:grid;grid-template-columns:212px minmax(0,1fr) 420px;min-height:0}
.main.nopanel{grid-template-columns:212px minmax(0,1fr) 0}
nav.views{border-right:1px solid var(--line);background:var(--side);overflow:auto;padding:12px 10px}
nav.views h2{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:8px 8px 8px}
nav.views button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;font-size:12.5px;color:var(--fg)}
nav.views button:hover{background:var(--line)}
nav.views button.on{background:var(--accent-soft);font-weight:600}
nav.views button i{font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--muted);width:18px;flex:none}
nav.views button small{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.viewselect{display:none}
/* stage */
.stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.stagebar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface);min-width:0;flex-wrap:wrap}
.stagebar .vt{min-width:0;flex:1}
.stagebar h1{font-size:14px;font-weight:600;margin:0;text-wrap:balance}
.stagebar p{margin:0;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tools select{background:var(--side);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12px}
.tools .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.stagebody{position:relative;flex:1;min-height:0;display:flex}
#viewside{width:250px;flex:none;border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:8px}
#viewside[hidden]{display:none}
#viewside button.item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;margin-bottom:2px}
#viewside button.item:hover{background:var(--side)}
#viewside button.item.on{background:var(--accent-soft)}
#viewside button.item b{display:block;font-size:12.5px;font-weight:600}
#viewside button.item span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.canvaswrap{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#cy{flex:1;min-height:0;background:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
#htmlview{flex:1;overflow:auto;padding:18px}
#htmlview[hidden],#cy[hidden]{display:none}
.loading{position:absolute;inset:auto 0 0 0;margin:auto;top:40%;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}
/* stepper */
#stepper{border-top:1px solid var(--line);background:var(--surface);padding:10px 14px;max-height:42%;overflow:auto}
#stepper[hidden]{display:none}
.stepctl{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stepctl b{font-variant-numeric:tabular-nums;font-size:12px}
.steptext{font-size:13px;line-height:1.55;max-width:80ch}
.steplist{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
.steplist button{font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums}
.steplist button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steplist button.seen{background:var(--accent-soft)}
/* popovers */
.pop{position:absolute;top:8px;right:8px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.16);padding:12px 14px;width:min(360px,calc(100% - 16px));max-height:calc(100% - 16px);overflow:auto}
.pop[hidden]{display:none}
.pop h3{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:10px 0 6px;font-weight:600}
.pop h3:first-child{margin-top:0}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.checks label{display:flex;gap:6px;align-items:center;font-size:12px;min-width:0}
.checks label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.checks label small{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:4px 10px;font-size:12px}
.seg button.on{background:var(--accent-soft);font-weight:600}
.legendrow{display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0}
.legendrow em{font-style:normal;color:var(--muted);font-size:11px;margin-left:auto}
.edgesw{width:22px;height:0;border-top:2px solid;flex:none}
/* tooltip */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);font-size:11.5px;line-height:1.45;border-radius:8px;padding:7px 9px;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#tip[hidden]{display:none}
#tip b{display:block;font-weight:600}
#tip code{font-family:var(--font-mono);font-size:10.5px;opacity:.8}
/* panel */
aside#panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-width:0;position:relative}
.main.nopanel aside#panel{display:none}
.phead{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:6px;align-items:center}
.phead .crumbs{flex:1;min-width:0;display:flex;gap:4px;align-items:center;overflow:hidden;font-size:11px;color:var(--muted);white-space:nowrap}
.phead .crumbs button{max-width:110px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.phead .crumbs button:hover{color:var(--fg);text-decoration:underline}
.pbody{padding:14px 16px 40px;min-width:0}
.kindchip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;color:var(--muted)}
.pbody h2{font-size:18px;line-height:1.3;margin:6px 0 4px;letter-spacing:-.2px;overflow-wrap:anywhere;text-wrap:balance}
.purpose{font-size:13px;line-height:1.6;margin:8px 0 10px;max-width:65ch}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);background:var(--side)}
.tag.crit{color:var(--crit);border-color:var(--crit)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.tag.doc{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;color:var(--muted)}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:'▸';font-size:10px;transition:transform .15s}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec>summary small{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:0}
.sec .in{margin-top:8px;min-width:0}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.items>li{min-width:0;font-size:12.5px;line-height:1.55}
ul.items>li .sub{color:var(--muted);font-size:12px;margin-top:2px}
.kv{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr);gap:4px 12px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ev{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin:2px 3px 0 0;color:var(--muted);background:var(--bg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.ev:hover{color:var(--fg);border-color:var(--line-strong)}
.lnk{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:2px;text-align:left;overflow-wrap:anywhere}
.lnk:hover{text-decoration-color:var(--accent)}
.nodechip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px 1px 6px;margin:2px 4px 2px 0;max-width:100%;background:var(--surface)}
.nodechip:hover{border-color:var(--line-strong);background:var(--side)}
.nodechip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.nodechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.grid{width:100%;border-collapse:collapse;font-size:11.5px}
table.grid th,table.grid td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
table.grid th{color:var(--muted);font-weight:600;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase}
.tablewrap{overflow-x:auto;max-width:100%}
.callout{border:1px solid var(--crit);border-radius:10px;padding:8px 10px;margin:10px 0;background:color-mix(in srgb,var(--crit) 7%,var(--surface))}
.callout b{color:var(--crit);font-size:11px;letter-spacing:.8px;text-transform:uppercase}
.decision{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.decision h4{margin:0 0 4px;font-size:13px;font-weight:600}
.decision p{margin:3px 0;font-size:12.3px}
.decision p em{font-style:normal;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-right:4px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.empty{color:var(--muted);font-size:12px}
/* heatmap */
.heat{border-collapse:separate;border-spacing:2px;font-size:12px}
.heat th{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 6px;text-align:center}
.heat th.rowh{text-align:left;text-transform:none;letter-spacing:0;font-size:12px;color:var(--fg);font-weight:500;max-width:280px}
.heat td{min-width:58px;text-align:center;border-radius:5px;padding:5px 4px;font-variant-numeric:tabular-nums}
.heat td.zero{color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
.heat tr:hover th.rowh{color:var(--accent)}
.htmlsec{max-width:1100px}
.htmlsec h2{font-size:15px;margin:18px 0 8px}
.htmlsec p.lead{color:var(--muted);max-width:75ch;margin:0 0 12px}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(10,14,9,.45);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(900px,100%);max-height:88dvh;overflow:auto;padding:20px 22px;position:relative}
#modal h2{margin:0 0 6px;font-size:18px}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:12px;border-radius:999px;padding:6px 14px;z-index:90}
#toast[hidden]{display:none}
.grip{display:none}
/* responsive */

.plain{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:10px 0 12px}
.plain>b{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.plain p{margin:4px 0;font-size:13.5px;line-height:1.6;max-width:68ch}
.plain .analogy{color:var(--muted);font-style:italic}
.tech{color:var(--muted);font-size:12px;margin-top:6px}
.tech summary{cursor:pointer}
#viewkey{position:absolute;left:10px;bottom:10px;z-index:12;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-width:min(320px,calc(100% - 20px));font-size:11.5px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
#viewkey[hidden]{display:none}
#viewkey .row{display:flex;align-items:center;gap:6px;margin:2px 0}
#viewkey .row i{width:12px;height:12px;border-radius:3px;border:1.6px solid;flex:none}
#viewkey .row small{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
#viewkey p{margin:6px 0 2px;color:var(--muted);line-height:1.45}
#viewkey .kh{display:flex;align-items:center;gap:6px;font-weight:600;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
#viewkey .kh button{margin-left:auto;color:var(--muted)}
#viewkey label{display:flex;gap:6px;align-items:center;margin-top:6px}
.start{max-width:1040px;margin:0 auto}
.start .hero{font-size:clamp(20px,2.4vw,28px);line-height:1.3;letter-spacing:-.4px;font-weight:600;max-width:34ch;text-wrap:balance;margin:6px 0 14px}
.start .lede p{font-size:14.5px;line-height:1.7;max-width:70ch;margin:0 0 10px}
.start h2{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.diagram{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:760px;height:auto}
.diagram .band{fill:var(--bg);stroke:var(--line)}
.diagram .bandt{fill:var(--muted);font-size:13px;font-weight:700;letter-spacing:.3px}
.diagram g[data-node]{cursor:pointer}
.diagram g[data-node] rect{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.4}
.diagram g[data-node]:hover rect{stroke:var(--accent);stroke-width:2.4}
.diagram .t1{fill:var(--fg);font-size:14px;font-weight:600}
.diagram .t2{fill:var(--muted);font-size:11.5px}
.diagram .ar{stroke:var(--muted);stroke-width:1.6;fill:none}
.diagram .al{fill:var(--muted);font-size:11px}
.diagram .k-infra rect{stroke:var(--k-infra)!important}.diagram .k-data rect{stroke:var(--k-data)!important}.diagram .k-actor rect{stroke:var(--k-actor)!important}.diagram .k-runtime rect{stroke:var(--k-runtime)!important}.diagram .k-ui rect{stroke:var(--k-ui)!important}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.parts button{text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;display:grid;gap:4px}
.parts button:hover{border-color:var(--accent)}
.parts b{font-size:13.5px}.parts span{font-size:12.5px;color:var(--muted);line-height:1.5}
ol.reading{padding-left:20px;display:grid;gap:8px;margin:0}
ol.reading li{font-size:13.5px;line-height:1.55}
.howto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.howto div{border:1px dashed var(--line-strong);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.55}
.howto b{display:block;margin-bottom:2px}
.gloss{display:grid;gap:10px;max-width:900px}
.gloss .term{border-bottom:1px solid var(--line);padding:8px 0;display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:12px}
.gloss .term b{font-size:14px}
.gloss .term p{margin:0;font-size:13.5px;line-height:1.6}
@media (max-width:860px){.gloss .term{grid-template-columns:1fr;gap:2px}#viewkey{font-size:11px;max-width:220px}}
@media (max-width:1180px){.main{grid-template-columns:184px minmax(0,1fr) 360px}}
@media (max-width:860px){
  body{overflow:hidden}
  .top{flex-wrap:wrap;gap:8px}
  .brand span{display:none}
  .search{order:3;flex-basis:100%;max-width:none}
  .main,.main.nopanel{grid-template-columns:minmax(0,1fr)}
  nav.views{display:none}
  .viewselect{display:block;flex:1;min-width:0}
  .viewselect select{width:100%;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
  .stagebar p{display:none}
  .stagebar{flex-wrap:nowrap;gap:6px;padding:6px 10px}
  .stagebar h1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #zin,#zout,label[for="hops"],.tools .sep{display:none}
  .tools{flex-wrap:nowrap;gap:2px}
  #viewside{position:absolute;inset:0 auto 0 0;width:min(280px,85%);z-index:15;box-shadow:8px 0 30px rgba(0,0,0,.15)}
  #viewside.collapsed{display:none}
  aside#panel{position:fixed;left:0;right:0;bottom:0;max-height:62dvh;border-left:0;border-top:1px solid var(--line-strong);border-radius:16px 16px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.22);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
  .main.nopanel aside#panel{display:none}
  .grip{display:block;width:44px;height:4px;border-radius:2px;background:var(--line-strong);margin:8px auto 0}
  .phead{border-radius:16px 16px 0 0}
  #stepper{max-height:38%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div id="app">
  <header class="top">
    <div class="brand"><b>Hermbot Atlas</b><span>architecture explorer</span></div>
    <div class="viewselect"><label for="viewsel" class="sr" hidden>View</label><select id="viewsel" aria-label="View"></select></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Search files, routes, tables, tools, features…" aria-label="Search the model">
      <kbd>/</kbd>
      <div id="results" hidden></div>
    </div>
    <div class="top-actions">
      <button id="covbadge" class="pill" title="Open the coverage report">Coverage</button>
      <button id="sdbtn" class="pill primary" title="Open the system design node">System design</button>
      <button id="themebtn" class="iconbtn" title="Switch light or dark" aria-label="Switch theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <div class="main" id="main">
    <nav class="views" id="views" aria-label="Views"></nav>
    <section class="stage">
      <div class="stagebar">
        <div class="vt"><h1 id="vtitle">Loading</h1><p id="vdesc"></p></div>
        <div class="tools">
          <button class="iconbtn" id="sidebtn" title="Show list" aria-label="Show list" hidden>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
          <button class="iconbtn" id="backbtn" title="Back" aria-label="Back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="iconbtn" id="fitbtn" title="Fit to screen" aria-label="Fit to screen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button class="iconbtn" id="zin" title="Zoom in" aria-label="Zoom in">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="iconbtn" id="zout" title="Zoom out" aria-label="Zoom out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
          <span class="sep"></span>
          <label for="hops" class="mono" style="color:var(--muted)">hops</label>
          <select id="hops" title="Neighbourhood depth for focus"><option>1</option><option selected>2</option><option>3</option></select>
          <select id="hopdir" title="Neighbourhood direction"><option value="both">in+out</option><option value="out">out</option><option value="in">in</option></select>
          <span class="sep"></span>
          <button class="iconbtn" id="filterbtn" title="Filters" aria-label="Filters">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg></button>
          <button class="iconbtn" id="legendbtn" title="Legend" aria-label="Legend">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="7" r="2"/><circle cx="6" cy="17" r="2"/><path d="M11 7h9M11 17h9"/></svg></button>
        </div>
      </div>
      <div class="stagebody">
        <div id="viewside" hidden></div>
        <div class="canvaswrap">
          <div id="cy" role="application" aria-label="Architecture graph"></div>
          <div id="viewkey" hidden></div>
          <div id="htmlview" hidden></div>
          <div id="stepper" hidden></div>
          <div class="loading" id="loading" hidden>Laying out graph…</div>
        </div>
        <div class="pop" id="filters" hidden></div>
        <div class="pop" id="legend" hidden></div>
      </div>
    </section>
    <aside id="panel" aria-label="Details"><div class="grip"></div><div class="phead"><div class="crumbs" id="crumbs"></div>
      <button class="iconbtn" id="pfocus" title="Focus neighbourhood" aria-label="Focus neighbourhood"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg></button>
      <button class="iconbtn" id="pclose" title="Close (Esc)" aria-label="Close panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="pbody" id="pbody"></div></aside>
  </div>
</div>
<div id="tip" hidden></div>
<div id="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="mtitle"><button class="iconbtn" id="mclose" style="position:absolute;top:12px;right:12px" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div id="mbody"></div></div></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
<script>
const MODEL = /*__MODEL__*/null;
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trunc = (s, n) => { s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const store = { get(k){ try { return localStorage.getItem('hba.' + k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem('hba.' + k, v); } catch(e){} } };

/* ------------------------------------------------------------------ indexes */
const NODES = MODEL.nodes, EDGES = MODEL.edges;
const N = new Map(); NODES.forEach((n, i) => { n._i = i; N.set(n.id, n); });
const OUT = new Map(), IN = new Map();
EDGES.forEach((e, i) => { e._i = i; (OUT.get(e.s) || OUT.set(e.s, []).get(e.s)).push(e); (IN.get(e.t) || IN.set(e.t, []).get(e.t)).push(e); });
const outs = id => OUT.get(id) || [], ins = id => IN.get(id) || [];
const DISC_BY_NODE = new Map();
(MODEL.discrepancies || []).forEach(d => (d.nodes || []).forEach(n => (DISC_BY_NODE.get(n) || DISC_BY_NODE.set(n, []).get(n)).push(d)));

/* ------------------------------------------------------------------ kinds & colours */
const KINDS = {
  'system-design': {t:'System design', f:'know', sh:'star'},
  actor: {t:'Actor', f:'actor', sh:'round-octagon'},
  service: {t:'Service / container', f:'infra', sh:'round-rectangle'},
  network: {t:'Network', f:'infra', sh:'cut-rectangle'},
  volume: {t:'Volume', f:'infra', sh:'barrel'},
  port: {t:'Port', f:'infra', sh:'round-tag'},
  env: {t:'Env var', f:'secret', sh:'tag'},
  secret: {t:'Secret / token', f:'secret', sh:'tag'},
  module: {t:'Backend module', f:'code', sh:'round-rectangle'},
  runtime: {t:'Runtime module', f:'runtime', sh:'round-rectangle'},
  plugin: {t:'Plugin file', f:'runtime', sh:'round-rectangle'},
  tool: {t:'Agent tool / hook', f:'runtime', sh:'round-pentagon'},
  script: {t:'Ops script', f:'dep', sh:'round-rectangle'},
  function: {t:'Function / class', f:'fn', sh:'ellipse'},
  route: {t:'HTTP route', f:'route', sh:'round-tag'},
  table: {t:'Table', f:'data', sh:'barrel'},
  bucket: {t:'Object store', f:'data', sh:'barrel'},
  migration: {t:'Schema / migration', f:'data', sh:'rectangle'},
  ui: {t:'Web UI file', f:'ui', sh:'round-rectangle'},
  feature: {t:'Feature', f:'know', sh:'round-diamond'},
  flow: {t:'Flow', f:'flow', sh:'round-hexagon'},
  sm: {t:'State machine', f:'state', sh:'diamond'},
  state: {t:'State', f:'state', sh:'round-rectangle'},
  test: {t:'Test', f:'test', sh:'round-rectangle'},
  'evidence-group': {t:'Evidence group', f:'test', sh:'rhomboid'},
  doc: {t:'Doc', f:'doc', sh:'rectangle'},
  archive: {t:'Archive item', f:'doc', sh:'rectangle'},
  dependency: {t:'Dependency / image', f:'dep', sh:'ellipse'},
  config: {t:'Config / build file', f:'dep', sh:'rectangle'},
  misc: {t:'Other file', f:'dep', sh:'rectangle'},
  concept: {t:'Concept', f:'know', sh:'round-octagon'},
  discrepancy: {t:'Discrepancy', f:'issue', sh:'triangle'},
};
const kindOf = k => KINDS[k] || {t:k, f:'dep', sh:'ellipse'};
const EDGE_KINDS = {
  imports:{t:'imports'}, calls:{t:'calls'}, http:{t:'HTTP request'}, reads:{t:'reads'}, writes:{t:'writes'},
  'stores-in':{t:'stores in'}, 'runs-in':{t:'runs in'}, 'attached-to':{t:'attached to'}, mounts:{t:'mounts'},
  'uses-secret':{t:'uses secret / env'}, spawns:{t:'spawns'}, polls:{t:'polls'}, webhooks:{t:'webhooks'},
  pushes:{t:'pushes'}, fetches:{t:'UI fetches'}, renders:{t:'renders'}, tests:{t:'tests'}, evidences:{t:'evidences'},
  documents:{t:'documents'}, implements:{t:'implements'}, transitions:{t:'transitions'}, defines:{t:'defines (structure)'},
  references:{t:'foreign key'}, 'depends-on':{t:'depends on'}, uses:{t:'uses dependency'}, involves:{t:'involves'},
  concerns:{t:'concerns'}, step:{t:'flow step'}
};
let palette = {};
function readPalette(){
  const cs = getComputedStyle(document.documentElement);
  const g = v => cs.getPropertyValue(v).trim();
  palette = {fg:g('--fg'), muted:g('--muted'), bg:g('--bg'), surface:g('--surface'), line:g('--line'), edge:g('--edge'), edgeHi:g('--edge-hi'),
    accent:g('--accent'), crit:g('--crit'), warn:g('--warn'), text:g('--node-text'), dim:parseFloat(g('--dim-alpha')) || .12};
  ['actor','infra','secret','code','fn','runtime','route','data','ui','know','flow','state','test','doc','dep','issue'].forEach(f => palette[f] = g('--k-' + f));
}
const colorOf = kind => palette[kindOf(kind).f] || palette.muted;

/* ------------------------------------------------------------------ helpers for derived sets */
const byKind = k => NODES.filter(n => n.kind === k);
const isFile = n => n.id.startsWith('file:');
const featureList = Object.keys(MODEL.features || {}).sort();
function featureNodesFor(fid){ const set = new Set([fid]); ins(fid).forEach(e => { if (e.k === 'implements') set.add(e.s); }); outs(fid).forEach(e => set.add(e.t)); return set; }
function layerOf(n){
  if (n.layer) return n.layer;
  if (n.kind === 'module' && n.path && n.path.startsWith('backend/')) return 'domain';
  return n.kind;
}

/* ------------------------------------------------------------------ view definitions */
const VIEWS = [
  {id:'start', no:'00', t:'Start here', d:'What Hermbot is, how the parts fit together, and where to look next.'},
  {id:'context', no:'01', t:'System context', d:'Hermbot as one box among its people and outside systems: the owner, model provider, SaaS connectors, push service and Docker.'},
  {id:'deploy', no:'02', t:'Deployment & security', d:'Every container, network zone, volume, published port and secret. Arrows show attachment, mounts, dependencies and who holds which credential.'},
  {id:'backend', no:'03', t:'Backend layers', d:'Every backend module grouped by layer, with the import graph between them.'},
  {id:'runtime', no:'04', t:'Bot runtime', d:'Inside a teammate container: the Hermes image, bootstrap, runtime API, the hermbot plugin and its tools, the admission gate, the computer and the volumes.'},
  {id:'er', no:'05', t:'Data model', d:'All PostgreSQL tables with their foreign keys, plus MinIO object storage. Open a table to see its columns, enums and readers/writers.'},
  {id:'api', no:'06', t:'API map', d:'UI files → HTTP routes → defining modules → tables. Every route of the API, supervisor and bot runtime.'},
  {id:'frontend', no:'07', t:'Frontend', d:'React components, the API client, the live event stream, the service worker and every endpoint the UI calls.'},
  {id:'features', no:'08', t:'Features', d:'Each feature with the reasoning behind it. Click a feature to expand the code, data and tools that implement it.'},
  {id:'flows', no:'09', t:'Flows', d:'End-to-end flows traced function by function. Step through them; the active step lights up in the graph.'},
  {id:'sms', no:'10', t:'State machines', d:'Status lifecycles of tasks, work items, requirements, approvals, routines, triggers, bots and more, with the code that moves each transition.'},
  {id:'heat', no:'11', t:'Test coverage', d:'Which features and modules are exercised by unit, integration, Hermes, live, browser and acceptance tests — and which are not.'},
  {id:'docs', no:'12', t:'Docs & history', d:'Plan documents, the archive, the phase timeline and the issue register, linked to the features and modules they describe.'},
  {id:'disc', no:'13', t:'Discrepancies', d:'Where docs and code disagree, dead or legacy paths, and open unknowns — each pinned to the nodes it concerns.'},
  {id:'all', no:'14', t:'Full graph', d:'Everything in the model, clustered by kind. Use filters and neighbourhood focus to explore.'},
  {id:'glossary', no:'15', t:'Glossary', d:'Plain definitions of the words used across this explorer.'},
];
const VIEW = Object.fromEntries(VIEWS.map(v => [v.id, v]));

function edgesAmong(set, kinds){
  const res = [];
  set.forEach(id => outs(id).forEach(e => { if (set.has(e.t) && (!kinds || kinds.includes(e.k))) res.push(e); }));
  return res;
}
function addNeighbors(set, ids, kinds, dir){
  ids.forEach(id => {
    if (dir !== 'in') outs(id).forEach(e => { if (!kinds || kinds.includes(e.k)) set.add(e.t); });
    if (dir !== 'out') ins(id).forEach(e => { if (!kinds || kinds.includes(e.k)) set.add(e.s); });
  });
}
const has = id => N.has(id);

let def_trunc = false;
function buildView(id, arg){
  def_trunc = false;
  const set = new Set(); let zones = null, layout = 'dagre', rank = 'LR', ekinds = null, extraEdges = [];
  if (id === 'context'){
    set.add('system-design');
    NODES.forEach(n => { if (n.kind === 'actor') set.add(n.id); });
    const svcOf = nid => { const n = N.get(nid); if (!n || !['module','function','route','service','runtime','plugin','script','ui','tool','config'].includes(n.kind)) return null; if (n.kind === 'service') return n.label; const m = n.module || (n.id.startsWith('file:') ? n.id : null); const r = m && outs(m).find(e => e.k === 'runs-in' && e.t.startsWith('svc:')); return r ? N.get(r.t).label : (n.path || n.label); };
    [...set].filter(a => a !== 'system-design').forEach(a => {
      const via = new Map();
      outs(a).forEach(e => { const v = svcOf(e.t); if (v) via.set(v, (via.get(v) || []).concat(e)); });
      ins(a).forEach(e => { const v = svcOf(e.s); if (v) via.set(v, (via.get(v) || []).concat(e)); });
      const ev = [...via.values()].flat();
      const kinds = [...new Set(ev.map(e => e.k))].filter(k => !['implements','involves','concerns','documents','defines'].includes(k));
      const names = [...via.keys()].map(v => String(v).split('/').pop());
      extraEdges.push({s:a, t:'system-design', k:'http', label:trunc(names.slice(0, 2).join(', ') + (names.length > 2 ? ' +' + (names.length - 2) : ''), 38), ev:ev.flatMap(e => e.ev).slice(0, 6)});
    });
    layout = 'concentric'; ekinds = [];
  } else if (id === 'deploy'){
    NODES.forEach(n => { if (['service','network','volume','port','secret','actor','bucket'].includes(n.kind)) set.add(n.id); if (n.kind === 'env') set.add(n.id); if (n.kind === 'dependency' && n.id.startsWith('img:')) set.add(n.id); });
    const zone = n => {
      if (n.kind === 'secret' || (n.kind === 'env' && n.facts && n.facts.sensitive)) return 'Secrets (tokens, keys, passwords)';
      if (n.kind === 'env') return 'Settings (other environment variables)';
      if (n.kind === 'dependency') return 'Images';
      if (n.kind === 'volume') return 'Volumes';
      if (n.kind === 'port' || n.kind === 'actor') return 'Host & outside';
      if (n.kind === 'bucket') return 'Control plane (network: control)';
      const nets = outs(n.id).filter(e => e.k === 'attached-to' && e.t.startsWith('net:')).map(e => e.t);
      if (n.kind === 'network') return n.id === 'net:control' ? 'Control plane (network: control)' : 'Bot plane (per-teammate networks)';
      if (/hermbot-bot|hermes-|model-fixture/.test(n.id)) return 'Bot plane (per-teammate networks)';
      if (nets.length > 1) return 'Bridge: control + bot networks';
      if (nets.includes('net:control')) return 'Control plane (network: control)';
      return 'Host & outside';
    };
    zones = ['Host & outside','Control plane (network: control)','Bridge: control + bot networks','Bot plane (per-teammate networks)','Volumes','Secrets (tokens, keys, passwords)','Settings (other environment variables)','Images'].map(z => ({name:z, ids:[]}));
    set.forEach(i => { const z = zones.find(z => z.name === zone(N.get(i))); z.ids.push(i); });
    layout = 'zones';
  } else if (id === 'backend'){
    NODES.forEach(n => { if (n.kind === 'module' && n.path && n.path.startsWith('backend/')) set.add(n.id); if (n.id === 'file:backend/schema.sql') set.add(n.id); });
    const order = ['api','domain','persistence','runtime-control','connectors','workers','notifications','runtime','config','ops'];
    const groups = {}; set.forEach(i => { const l = layerOf(N.get(i)); (groups[l] = groups[l] || []).push(i); });
    zones = Object.keys(groups).sort((a,b) => (order.indexOf(a)+99*(order.indexOf(a)<0)) - (order.indexOf(b)+99*(order.indexOf(b)<0))).map(l => ({name:'Layer: ' + l, ids:groups[l].sort()}));
    layout = 'zones'; ekinds = ['imports'];
  } else if (id === 'runtime'){
    NODES.forEach(n => {
      if (['runtime','plugin','tool'].includes(n.kind)) set.add(n.id);
      if (n.id === 'file:hermbot_runtime_gate.py' || n.id === 'file:docker/hermes.Dockerfile' || n.id === 'svc:hermbot-bot-*' || /^(vol|net):hermbot-bot/.test(n.id) || n.id === 'actor:model-provider') set.add(n.id);
      if (n.kind === 'route' && n.path && (n.path.startsWith('docker/') || /\/internal\//.test(n.label))) set.add(n.id);
      if (n.kind === 'port' && /8642|590|608/.test(n.id)) set.add(n.id);
    });
    if (has('img:nousresearch/hermes-agent')) set.add('img:nousresearch/hermes-agent');
    const z = n => n.kind === 'tool' ? 'Plugin tools & hooks' : n.kind === 'route' ? (n.path && n.path.startsWith('docker/') ? 'Runtime API (inside the bot)' : 'Backend internal API (/internal)') :
      (n.kind === 'volume' || n.kind === 'network' || n.kind === 'port') ? 'Container, network & volumes' : n.kind === 'plugin' ? 'Plugin' : n.kind === 'service' || n.kind === 'actor' ? 'Container, network & volumes' : 'Image, bootstrap & gate';
    const names = ['Image, bootstrap & gate','Plugin','Plugin tools & hooks','Runtime API (inside the bot)','Backend internal API (/internal)','Container, network & volumes'];
    zones = names.map(nm => ({name:nm, ids:[]})); set.forEach(i => zones.find(x => x.name === z(N.get(i))).ids.push(i));
    layout = 'zones';
  } else if (id === 'er'){
    NODES.forEach(n => { if (n.kind === 'table' || n.kind === 'bucket') set.add(n.id); });
    const featOf = t => { const f = outs(t).filter(e => e.k === 'implements' && e.t.startsWith('feature:')).map(e => e.t); return f.length ? f.sort((a, b) => featureNodesFor(b).size - featureNodesFor(a).size).pop() : null; };
    const g = {}; set.forEach(t => { const f = featOf(t) || (t.startsWith('bucket:') ? 'feature:artifacts' : '_other'); (g[f] = g[f] || []).push(t); });
    zones = Object.keys(g).sort().map(f => ({name:f === '_other' ? 'Shared / other tables' : (N.get(f) || {label:f}).label, ids:g[f].sort()}));
    ekinds = ['references','stores-in']; layout = 'zones';

  if (def.layout === 'custom'){ opts = {name:'preset', positions:n => def.positions[n.id()] || {x:0, y:0}, fit:true, padding:40}; }
  else if (def.layout === 'zones'){ const pos = zonesLayout(def); opts = {name:'preset', positions:n => pos[n.id()] || {x:0, y:0}, fit:true, padding:30}; }
  else if (def.layout === 'concentric'){ opts = {name:'concentric', concentric:n => n.data('kind') === 'system-design' ? 10 : n.data('kind') === 'feature' ? 6 : n.data('kind') === 'actor' ? 3 : n.degree(), levelWidth:() => 2, minNodeSpacing:def.set.size < 30 ? 70 : 24, fit:true, padding:40, animate:false}; }
  else { opts = {name:'dagre', rankDir:def.rank || 'LR', nodeSep:def.nodeSep || 18, rankSep:def.rankSep || 70, edgeSep:8, fit:true, padding:30, animate:false}; }

}

function applyFilters(){
  if (!cy) return;
  const {kinds, ekinds, mode, layer, feature} = filterState;
  const featSet = feature ? featureNodesFor(feature) : null;
  cy.nodes().not('.zone').forEach(n => {
    const m = N.get(n.id()); if (!m) return;
    let ok = (!kinds || kinds.has(m.kind)) && (!layer || layerOf(m) === layer) && (!featSet || featSet.has(m.id));
    n.removeClass('hide fdim');
    if (!ok) n.addClass(mode === 'hide' ? 'hide' : 'dim');
  });
  cy.edges().forEach(e => { e.removeClass('hide'); if (ekinds && !ekinds.has(e.data('k'))) e.addClass(mode === 'hide' ? 'hide' : 'dim'); });
  cy.nodes('.zone').forEach(z => { const vis = z.children().filter(c => !c.hasClass('hide')); z.toggleClass('hide', vis.length === 0); });
}

let step = 0, playing = null;

    <div class="steptext">${md(((PLAIN.flows || {})[current.arg] || {}).steps_plain ? PLAIN.flows[current.arg].steps_plain[step] || textOf(s) : textOf(s))}</div>

    <div class="steplist">${stepsOf(fl).map((x, j) => `<button data-step="${j}" class="${j === step ? 'on' : j < step ? 'seen' : ''}" title="${esc(trunc(textOf(x), 120))}">${j + 1}</button>`).join('')}</div>

}
